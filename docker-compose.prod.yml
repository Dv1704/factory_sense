version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-factory_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-factory_password}
      POSTGRES_DB: ${DB_NAME:-factorysense}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - factory_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  web:
    build: .
    image: factorysenseai-app
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-factory_user}:${DB_PASSWORD:-factory_password}@db/${DB_NAME:-factorysense}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - SUPERADMIN_EMAIL=${SUPERADMIN_EMAIL}
      - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD}
      - VOLTAGE=${VOLTAGE:-400}
      - POWER_FACTOR=${POWER_FACTOR:-0.85}
      - EFFICIENCY=${EFFICIENCY:-0.90}
      - GRID_EMISSION_FACTOR=${GRID_EMISSION_FACTOR:-0.233}
      - RAW_DATA_RETENTION_DAYS=${RAW_DATA_RETENTION_DAYS:-3650}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - factory_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

networks:
  factory_network:
    driver: bridge

volumes:
  postgres_data:
